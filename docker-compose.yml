services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 && nc -z 127.0.0.1 10001 && nc -z 127.0.0.1 10002"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - coffee-net

  functions:
    image: chengedock/coffeechill-functions:v3.0
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
      AzureFilesConnection: ${AZURE_FILES_CONNECTION_STRING:?Set AZURE_FILES_CONNECTION_STRING in your .env file}
    networks:
      - coffee-net

  gateway:
    image: chengedock/coffeechill-gateway:v1.0
    depends_on:
      - functions
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__AzureStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1
      - AzureFunctions__BaseUrl=http://functions:80
      - Jwt__Key=CoffeeNChill-Super-Secret-Jwt-Signing-Key-2026!
      - Jwt__Issuer=CoffeeNChill.Gateway
      - Jwt__Audience=CoffeeNChill.Clients
    networks:
      - coffee-net

volumes:
  azurite_data:

networks:
  coffee-net:
    driver: bridge